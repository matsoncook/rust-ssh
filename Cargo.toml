[package]
name = "rust_ssh"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "ssh_connect"
path = "src/bin/ssh_connect.rs"

[[bin]]
name = "webserver"
path = "src/bin/webserver.rs"

[dependencies]

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

axum = "0.8"
